<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Taarougem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e1713;--ink:#efe5d8;--ink-soft:#b0a090;--accent:#c8a36a;--accent-dk:#e2c592;--dark:#1a1411}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Jost",system-ui,sans-serif;font-weight:300;min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px 16px;line-height:1.6}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.6rem;letter-spacing:.32em;margin-bottom:64px;display:block;color:var(--ink);text-decoration:none}
.eyebrow{font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(2.6rem,7vw,4rem);line-height:1.1;margin:16px 0 20px}
h1 em{color:var(--accent)}
p{color:var(--ink-soft);max-width:440px;margin:0 auto 40px}
.btn{display:inline-block;padding:15px 38px;background:var(--accent);color:var(--dark);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;transition:background .25s}
.btn:hover{background:var(--accent-dk)}
</style>
</head>
<body>
<main>
  <a class="logo" href="index.html">TAAROUGEM</a>
  <span class="eyebrow">Order confirmed</span>
  <h1>Thank you, <em>truly.</em></h1>
  <p>Your bracelet is being prepared by hand. A receipt is on its way to your inbox, and we'll let you know as soon as your parcel ships.</p>
  <a class="btn" href="index.html">Back to the shop</a>
</main>
<script>try{ localStorage.removeItem("taarougem-cart"); }catch(e){}</script>
</body>
</html>
