<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow House 3D Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a full-screen 3D model of Glow House. A slide card sits beside it (desktop) or below it (phone); each slide flies the camera to a floor and pulls that floor out like a drawer. Single daytime nude look by design. */
:root {
  --bg: #FAF5EF;
  --surface: #FFFDFA;
  --sand: #EBDACB;
  --ink: #33241E;
  --muted: #7A665B;
  --line: #E8D9CB;
  --accent: #A45446;
  --gold: #946F42;
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --card-w: min(440px, 40vw);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.stage { position: fixed; inset: 0; background: radial-gradient(55% 45% at 70% 10%, rgba(255, 241, 222, .95), transparent 70%), linear-gradient(180deg, #DDE5EA 0%, #EFE6DD 48%, #E8D3C1 100%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.dragging { cursor: grabbing; }
.fallback { position: absolute; inset: 0; background: center 30% / cover no-repeat url("assets/glow-house-facade.jpg"); }

.top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.brand { display: flex; align-items: baseline; gap: 10px; pointer-events: auto; }
.brand b { font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: 24px; }
.brand span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hint { font-size: 12.5px; color: var(--muted); background: rgba(255, 253, 250, .75); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); }

.labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.flabel { position: absolute; display: flex; align-items: center; gap: 8px; transform: translate(0, -50%); font-size: 12.5px; font-weight: 600; white-space: nowrap; pointer-events: auto; cursor: pointer;
  background: rgba(255, 253, 250, .88); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 3px; box-shadow: 0 4px 14px rgba(90, 60, 40, .1); transition: opacity .35s, background .2s; }
.flabel i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); background: var(--sand); color: var(--ink); font-size: 13px; }
.flabel.on { background: var(--accent); color: #FFFDFA; border-color: var(--accent); }
.flabel.on i { background: #FFFDFA; color: var(--accent); }
.flabel.dim { opacity: 0; pointer-events: none; }

.card { position: fixed; z-index: 4; right: max(24px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); width: var(--card-w); max-height: calc(100% - 160px); overflow-y: auto;
  background: rgba(255, 253, 250, .92); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 30px 30px 26px; box-shadow: 0 24px 60px rgba(90, 60, 40, .16); }
.card.swap { animation: swap .5s ease; }
@keyframes swap { from { opacity: .2; transform: translateY(calc(-50% + 14px)); } to { opacity: 1; transform: translateY(-50%); } }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
.eyebrow .fl { font-family: var(--f-display); letter-spacing: 0; font-size: 15px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #FFFDFA; text-transform: none; }
.card h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(34px, 3.6vw, 50px); line-height: 1.02; letter-spacing: -.015em; }
.card h1 em { color: var(--gold); }
.card h2 { font-family: var(--f-display); font-weight: 500; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.08; letter-spacing: -.01em; }
.card .lede { margin-top: 12px; color: var(--muted); font-size: 15.5px; }
.card ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 9px; }
.card li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; font-size: 14.5px; }
.card li::before { content: "✦"; color: var(--gold); font-size: 11px; line-height: 1.9; }
.card li b { font-weight: 700; }
.faces { display: flex; margin-top: 18px; }
.faces img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--surface); margin-left: -10px; box-shadow: 0 2px 6px rgba(90, 60, 40, .15); }
.faces img:first-child { margin-left: 0; }
.shots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
.shots img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
.shots.wide { grid-template-columns: 1fr; }
.shots.wide img { aspect-ratio: 16 / 10; object-position: center 40%; }
.tones { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 18px; }
.tones i { aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 -4px 8px rgba(0, 0, 0, .12); }
.compare { margin-top: 16px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: 13.5px; }
.compare div { display: grid; grid-template-columns: 1fr 1fr; }
.compare div + div { border-top: 1px solid var(--line); }
.compare span { padding: 9px 12px; }
.compare span + span { background: #F6ECE3; font-weight: 600; }
.compare .h span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.swatches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
.swatches div { border-radius: 12px; height: 64px; display: flex; align-items: flex-end; padding: 6px 8px; font-size: 11px; font-weight: 700; border: 1px solid rgba(0, 0, 0, .06); }
.type-demo { margin-top: 14px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.type-demo b { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 34px; }
.type-demo span { font-size: 14px; color: var(--muted); }
.steps { counter-reset: s; }
.steps li { counter-increment: s; grid-template-columns: 26px 1fr; }
.steps li::before { content: counter(s); font-family: var(--f-display); font-size: 15px; color: #FFFDFA; background: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; line-height: 1; }
.cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; background: var(--accent); color: #FFFDFA; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-size: 14px; text-decoration: none; }
.cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-left: 6px; }
.note { margin-top: 14px; font-size: 12.5px; color: var(--muted); }

.nav { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; align-items: center; gap: 12px;
  background: rgba(255, 253, 250, .9); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; padding: 6px; box-shadow: 0 10px 30px rgba(90, 60, 40, .12); max-width: calc(100% - 32px); }
.nav button.arrow { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: #FFFDFA; display: grid; place-items: center; flex: none; }
.nav button.arrow[disabled] { opacity: .3; cursor: default; }
.dots { display: flex; gap: 6px; align-items: center; overflow: hidden; }
.dots button { width: 8px; height: 8px; padding: 0; border-radius: 4px; border: 0; background: var(--line); transition: width .3s, background .3s; flex: none; }
.dots button[aria-current="step"] { width: 24px; background: var(--accent); }
.count { font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }

@media (max-width: 820px) {
  :root { --card-w: auto; }
  .card { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); transform: none; max-height: 50%; padding: 20px 20px 18px; border-radius: 18px; }
  .card.swap { animation: swapm .5s ease; }
  @keyframes swapm { from { opacity: .2; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card h1 { font-size: 32px; }
  .card h2 { font-size: 25px; }
  .hint { display: none; }
  .dots { max-width: 150px; }
  .flabel { font-size: 11.5px; }
}
@media (prefers-reduced-motion: reduce) { .card.swap { animation: none; } }
</style>
</head>
<body>
<div class="stage" aria-hidden="true"><canvas id="gl"></canvas></div>
<div class="labels" id="labels"></div>

<header class="top">
  <div class="brand"><b>Vibrez</b><span>Glow House · 3D tour</span></div>
  <span class="hint">Drag to turn the building · Click a floor to visit it · ← → to move</span>
</header>

<article class="card" id="card" aria-live="polite"></article>

<nav class="nav" aria-label="Presentation">
  <button class="arrow" id="prev" aria-label="Previous slide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="dots" id="dots"></div>
  <span class="count" id="count">1 / 16</span>
  <button class="arrow" id="next" aria-label="Next slide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const PROTOTYPE_URL = 'https://claude.ai/artifact/4jgpz25c9YiahE7drznHvC';
  const ph = n => `assets/photos/${n}.jpg`;
  const TONES = ['#F5DCCB', '#EDCDB3', '#E2B691', '#D5A27B', '#C58A5C', '#AD7046', '#925935', '#764327', '#59311C', '#3E2213'];

  const FLOORS = [
    { n: 'G', name: 'Lobby' }, { n: '1', name: 'The Boutique' }, { n: '2', name: 'Tutorial Studio' }, { n: '3', name: 'Masterclass Atelier' },
    { n: '4', name: 'Review Lab' }, { n: '5', name: 'The Lounge' }, { n: '6', name: 'Spa & Salon' }, { n: '7', name: 'Advice Bar' }, { n: '8', name: 'Glow Forward' }
  ];
  const floorSlide = (i, title, lede, bullets, extra = '') => ({
    view: 'floor', floor: i,
    html: `<div class="eyebrow"><span class="fl">${FLOORS[i].n}</span>${FLOORS[i].name}</div><h2>${title}</h2><p class="lede">${lede}</p><ul>${bullets.map(b => `<li><span>${b}</span></li>`).join('')}</ul>${extra}`
  });

  const SLIDES = [
    { view: 'cover', html: `<div class="eyebrow">Vibrez · Share your passion</div><h1>Glow House, <em>the home</em> of beauty lovers</h1>
      <p class="lede">The beauty building of the Vibrez universe: makeup, skincare and fragrance, shopped, learned and shared by a community where every face is welcome.</p>
      <div class="faces"><img src="${ph('imani')}" alt=""><img src="${ph('hana')}" alt=""><img src="${ph('arjun')}" alt=""><img src="${ph('claire-sq')}" alt=""><img src="${ph('kwame')}" alt=""><img src="${ph('maya-sq')}" alt=""><img src="${ph('nadia')}" alt=""></div>
      <button class="cta" data-go="1">Start the tour →</button>` },
    { view: 'wide', html: `<div class="eyebrow">The opportunity</div><h2>A beauty experience social feeds can't give</h2>
      <p class="lede">Instagram, TikTok and YouTube inspire, then send people elsewhere to buy, book and ask. Glow House keeps the whole journey in one welcoming place.</p>
      <div class="compare"><div class="h"><span>On social feeds</span><span>In Glow House</span></div>
      <div><span>An algorithm picks what you see</span><span>Your skin picks what you see</span></div>
      <div><span>Filtered skin, sponsored reviews</span><span>Unfiltered looks, reviews tagged by skin</span></div>
      <div><span>Watch, then leave to buy</span><span>Learn, buy the shade, book a pro</span></div>
      <div><span>Comment sections</span><span>Hosted rooms with house rules</span></div></div>` },
    { view: 'universe', html: `<div class="eyebrow">The Vibrez universe</div><h2>Every passion is a building on the map</h2>
      <p class="lede">Members walk a shared map and step inside the communities they love. Glow House is the first landmark: tap the facade and the doors open onto the lobby.</p>
      <div class="shots wide"><img src="assets/glow-house-facade.jpg" alt="Glow House facade in daylight"></div>
      <p class="note">Facade inspired by London's grand Edwardian department stores, in cream stone and soft daylight.</p>` },
    { view: 'overview', html: `<div class="eyebrow">Inside the building</div><h2>A lobby and eight floors, one journey</h2>
      <p class="lede">An elevator links every floor, so people move from inspiration to purchase to community without leaving.</p>
      <ul>${FLOORS.slice().reverse().map(f => `<li><span><b>${f.n === 'G' ? 'Ground' : 'Floor ' + f.n}</b> · ${f.name}</span></li>`).join('')}</ul>
      <p class="note">Click any floor on the model to jump to it.</p>` },
    floorSlide(0, 'The beauty passport', 'Members describe their skin once. Every floor adapts to it.',
      ['<b>10 skin tones × 4 undertones</b>, skin type and concerns', 'Instant foundation shade match (e.g. <b>320W</b>)', 'Shapes products, reviews and routines on every floor'],
      `<div class="tones">${TONES.map(c => `<i style="background:${c}"></i>`).join('')}</div>`),
    floorSlide(1, 'Shop with your shade already found', 'Makeup, skincare and fragrance picked by the community.',
      ['Your shade is preselected on every product', '<b>“88% of combination skin rate it 4★+”</b> on each card', 'Real, unbranded product photography'],
      `<div class="shots"><img src="${ph('p1')}" alt="Serum foundation"><img src="${ph('p2')}" alt="Nude lipstick"><img src="${ph('p4')}" alt="Blush powder"><img src="${ph('p5')}" alt="Perfume"></div>`),
    floorSlide(2, 'Learn a look, step by step', 'Follow-along tutorials with progress saved as you tick each step.',
      ['Looks for <b>monolids, hooded eyes, deep skin, mature skin</b>', 'A gender-free skin and brows routine', 'Filter by time: under 10 minutes, beginner, advanced'],
      `<div class="shots"><img src="${ph('maya')}" alt=""><img src="${ph('nia')}" alt=""><img src="${ph('claire')}" alt=""><img src="${ph('theo')}" alt=""></div>`),
    floorSlide(3, 'Masterclasses with the artists', 'Live classes with makeup artists and dermatologists.',
      ['Ask questions live; keep the replay forever', 'Reserve a seat; reminders before class', 'Artists work on several skin types and tones in each class'],
      `<div class="shots"><img src="${ph('amara')}" alt=""><img src="${ph('lea')}" alt=""><img src="${ph('arjun')}" alt=""><img src="${ph('priya')}" alt=""></div>`),
    floorSlide(4, 'Honest reviews from skin like yours', 'Every review shows who wrote it and how long they wore it.',
      ['Skin type, tone and age range on every review', '<b>“Only show people like me”</b> switch', 'Wear-tested badge; no sponsored reviews'],
      `<div class="faces"><img src="${ph('nadia')}" alt=""><img src="${ph('emma')}" alt=""><img src="${ph('kwame')}" alt=""><img src="${ph('lucia')}" alt=""><img src="${ph('imani')}" alt=""><img src="${ph('sam')}" alt=""></div>`),
    floorSlide(5, 'The Lounge', 'Topic rooms where beauty lovers talk trends, kindly.',
      ['Trend Watch, Skincare Science, Fragrance Corner, First Steps', 'Each room has a host who keeps it kind and on topic', 'House rules: be kind about every face, no selling'],
      `<div class="faces"><img src="${ph('zoe')}" alt=""><img src="${ph('rashid')}" alt=""><img src="${ph('hana')}" alt=""><img src="${ph('omar')}" alt=""><img src="${ph('ali')}" alt=""></div>`),
    floorSlide(6, 'Book a treatment nearby', 'Independent beauty businesses, rated by the community.',
      ['Choose a place, a treatment, a day and a time', 'Facials, brows, lashes, bridal trials, head spa', 'Free cancellation up to 24 hours before'], ''),
    floorSlide(7, 'Tips, routines and straight answers', 'Advice from licensed estheticians, dermatologists and artists.',
      ['Morning and evening routine built for your skin type', 'Myth-or-fact cards and a scent finder by mood', 'Ask an expert and get a real answer'],
      `<div class="faces"><img src="${ph('ines')}" alt=""><img src="${ph('priya')}" alt=""><img src="${ph('sofia-sq')}" alt=""></div>`),
    floorSlide(8, 'Give back, get seen', 'The top floor, under the dome: where members stand out and open doors for others.',
      ['<b>Next Beauty Sensation:</b> a monthly talent search, community votes plus an artist panel, a paid brand collaboration to win',
       '<b>Weekly challenges</b> and <b>fair giveaways</b>: free to enter, no follow-for-follow',
       '<b>Glow Forward Scholarships:</b> funded makeup and esthetician courses for members who can\'t afford the fees, paid by 2% of Boutique sales and partners',
       '<b>Creator path</b> from Member to Glow Star, plus mentorship circles and free Confidence Day makeovers before job interviews'],
      `<div class="faces"><img src="${ph('imani')}" alt=""><img src="${ph('lucia')}" alt=""><img src="${ph('hana')}" alt=""><img src="${ph('nia')}" alt=""><img src="${ph('theo')}" alt=""><img src="${ph('zoe')}" alt=""></div>`),
    { view: 'wide', html: `<div class="eyebrow">What we stand for</div><h2>Inclusive, positive, genuine</h2>
      <ul><li><span><b>Inclusive:</b> every product shown on at least five skin tones; all ages and genders</span></li>
      <li><span><b>Positive:</b> hosted rooms, no skin or body shaming</span></li>
      <li><span><b>Relatable and genuine:</b> no filters on tutorials or reviews, no sponsored reviews</span></li>
      <li><span><b>Welcoming:</b> a passport that takes 20 seconds, nothing gated behind expertise</span></li></ul>
      <div class="faces"><img src="${ph('imani')}" alt=""><img src="${ph('hana')}" alt=""><img src="${ph('arjun')}" alt=""><img src="${ph('claire-sq')}" alt=""><img src="${ph('kwame')}" alt=""><img src="${ph('maya-sq')}" alt=""><img src="${ph('nadia')}" alt=""><img src="${ph('zoe')}" alt=""><img src="${ph('omar')}" alt=""></div>` },
    { view: 'wide', html: `<div class="eyebrow">Design language</div><h2>Luxury in daylight, never pretentious</h2>
      <p class="lede">A nude palette, a beauty-house serif used sparingly, and real photography of real skin.</p>
      <div class="swatches"><div style="background:#FAF5EF">Ivory</div><div style="background:#EBDACB">Sand</div><div style="background:#E8C4B0">Blush</div><div style="background:#A88B79;color:#FFFDFA">Taupe</div><div style="background:#6E5244;color:#FFFDFA">Cocoa</div></div>
      <div class="type-demo"><b>Glow House</b><span>Bodoni Moda for display · Manrope for reading</span></div>` },
    { view: 'cover', html: `<div class="eyebrow">Next steps</div><h2>From prototype to opening day</h2>
      <ul class="steps"><li><span>Test the floors with 5–10 beauty lovers</span></li><li><span>Set the business model per floor: commission, tickets, booking fees</span></li>
      <li><span>Define moderation and expert verification</span></li><li><span>Partner with brands for full shade libraries</span></li><li><span>Build the app on the Vibrez design system</span></li></ul>
      <a class="cta" href="${PROTOTYPE_URL}" target="_blank" rel="noopener">Open the clickable prototype ↗</a><button class="cta ghost" data-go="0">Restart tour</button>
      <p class="note">Names, products and businesses are examples. Photos: Unsplash, shown for illustration.</p>` }
  ];

  /* ---------- Slides UI ---------- */
  let cur = 0;
  const card = $('#card'), dots = $('#dots');
  dots.innerHTML = SLIDES.map((_, i) => `<button aria-label="Slide ${i + 1}" data-go="${i}"></button>`).join('');
  function show(i, fromHash) {
    cur = Math.max(0, Math.min(SLIDES.length - 1, i));
    card.innerHTML = SLIDES[cur].html;
    card.classList.remove('swap'); void card.offsetWidth; card.classList.add('swap');
    card.scrollTop = 0;
    [...dots.children].forEach((d, k) => d.toggleAttribute('aria-current', false) || (k === cur && d.setAttribute('aria-current', 'step')));
    $('#count').textContent = `${cur + 1} / ${SLIDES.length}`;
    $('#prev').disabled = cur === 0; $('#next').disabled = cur === SLIDES.length - 1;
    const want = 'slide-' + (cur + 1);
    if (!fromHash && location.hash.slice(1) !== want) history.replaceState(null, '', '#' + want);
    if (scene3d) scene3d.setView(SLIDES[cur]);
  }
  document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) show(+g.dataset.go); });
  $('#prev').onclick = () => show(cur - 1);
  $('#next').onclick = () => show(cur + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); show(cur + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(SLIDES.length - 1);
  });
  const fromHash = () => { const m = location.hash.match(/^#slide-(\d+)$/); return m ? +m[1] - 1 : 0; };
  window.addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) show(i, true); });

  /* ---------- 3D building ---------- */
  let scene3d = null;
  try { if (window.THREE) scene3d = build3D(); } catch (err) { scene3d = null; }
  if (!scene3d) { const f = document.createElement('div'); f.className = 'fallback'; $('.stage').appendChild(f); $('.hint').hidden = true; }
  show(fromHash(), true);

  function build3D() {
    const canvas = $('#gl');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    scene.add(new THREE.HemisphereLight(0xfff6ec, 0xb39a84, 0.62));
    const sun = new THREE.DirectionalLight(0xfff0dc, 0.62);
    sun.position.set(8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 14, bottom: -4, near: 1, far: 40 });
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xe9eef2, 0.22); fill.position.set(-8, 6, -4); scene.add(fill);

    // ground: warm cobbled plaza
    const gtex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#E3CFBC'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 16) for (let x = (y / 16) % 2 ? 8 : 0; x < w; x += 16) {
        g.fillStyle = `rgba(${150 + Math.random() * 30},${120 + Math.random() * 25},${95 + Math.random() * 20},.18)`; g.fillRect(x + 1, y + 1, 14, 14);
      }
    }, 6);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(16, 72), new THREE.MeshStandardMaterial({ map: gtex, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    const W = 6, D = 4, FH = 0.95, GH = 1.35;
    const stone = '#EEDFCC', stone2 = '#E2CDB6';
    const gold = new THREE.MeshStandardMaterial({ color: 0xC9A46A, metalness: 0.6, roughness: 0.35 });
    const slate = new THREE.MeshStandardMaterial({ color: 0x6E7480, roughness: 0.8 });
    const trim = new THREE.MeshStandardMaterial({ color: 0xF6ECDF, roughness: 0.7 });

    function canvasTex(w, h, draw, repeat) {
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
      const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
      if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
      return t;
    }
    function windowRow(g, w, h, count, arched, seed) {
      const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, stone); grd.addColorStop(1, stone2);
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      g.fillStyle = 'rgba(150,115,85,.10)'; for (let y = 22; y < h; y += 22) g.fillRect(0, y, w, 1.5);
      g.fillStyle = '#D9C2A8'; g.fillRect(0, h - 10, w, 10);
      const pitch = w / count, ww = pitch * 0.46, wh = h * 0.62, top = h * 0.16;
      for (let k = 0; k < count; k++) {
        const x = k * pitch + (pitch - ww) / 2;
        g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(k * pitch + 3, 0, 6, h - 10); // pilaster light
        g.fillStyle = '#F8F0E6'; roundWin(g, x - 6, top - 6, ww + 12, wh + 10, arched);
        const gl = g.createLinearGradient(0, top, 0, top + wh); gl.addColorStop(0, '#D3DEE3'); gl.addColorStop(1, '#93A6AF');
        g.fillStyle = gl; roundWin(g, x, top, ww, wh, arched);
        if ((k + seed) % 3 === 0) { g.fillStyle = 'rgba(244,232,218,.85)'; g.fillRect(x, top + (arched ? ww / 2 : 0), ww, wh * 0.32); }
        g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3; g.beginPath();
        g.moveTo(x + ww / 2, top); g.lineTo(x + ww / 2, top + wh); g.moveTo(x, top + wh * 0.58); g.lineTo(x + ww, top + wh * 0.58); g.stroke();
        g.fillStyle = '#F8F0E6'; g.fillRect(x - 10, top + wh + 2, ww + 20, 7);
      }
    }
    function roundWin(g, x, y, w, h, arched) {
      g.beginPath();
      if (arched) { g.moveTo(x, y + h); g.lineTo(x, y + w / 2); g.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); g.lineTo(x + w, y + h); }
      else g.rect(x, y, w, h);
      g.closePath(); g.fill();
    }
    function groundFront(g, w, h) {
      const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, stone); grd.addColorStop(1, stone2);
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      g.fillStyle = '#D7BFA4'; g.fillRect(0, 0, w, 14);
      [[60, 470], [w - 530, 470]].forEach(([x, ww]) => {
        g.fillStyle = '#F7EEE4'; g.fillRect(x - 8, 50, ww + 16, h - 80);
        const sh = g.createLinearGradient(0, 58, 0, h - 40); sh.addColorStop(0, '#FBEBD6'); sh.addColorStop(1, '#E9C9A3');
        g.fillStyle = sh; g.fillRect(x, 58, ww, h - 110);
        g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x, 58, ww * 0.25, h - 110);
        for (let k = 0; k < 5; k++) { // products on shelves
          const px = x + 50 + k * 90; const tall = 40 + (k % 3) * 18;
          g.fillStyle = ['#C98A86', '#E9D7E6', '#B58A5E', '#F2A5BE', '#8E6A4E'][k]; g.fillRect(px, h - 52 - tall, 26, tall);
          g.fillStyle = '#C9A46A'; g.fillRect(px + 4, h - 60 - tall, 18, 8);
        }
        g.fillStyle = '#C9A46A'; g.fillRect(x, h - 52, ww, 4);
      });
      const cx = w / 2; // bronze door
      g.fillStyle = '#F7EEE4'; roundWin(g, cx - 120, 40, 240, h - 40, true);
      const dg = g.createLinearGradient(0, 60, 0, h); dg.addColorStop(0, '#E9D3A8'); dg.addColorStop(1, '#8C6A3E');
      g.fillStyle = dg; roundWin(g, cx - 96, 64, 192, h - 64, true);
      g.strokeStyle = '#6B4F2C'; g.lineWidth = 4; g.beginPath(); g.moveTo(cx, 120); g.lineTo(cx, h); g.stroke();
    }
    function frontMat(i) {
      const tex = i === 0 ? canvasTex(1536, 344, groundFront) : canvasTex(1536, 242, (g, w, h) => windowRow(g, w, h, 7, i % 2 === 1, i));
      return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, emissive: new THREE.Color(0xFFE6C8), emissiveIntensity: 0 });
    }
    function sideMat(i) {
      const tex = i === 0 ? canvasTex(1024, 344, (g, w, h) => windowRow(g, w, h, 4, true, 1)) : canvasTex(1024, 242, (g, w, h) => windowRow(g, w, h, 4, i % 2 === 1, i + 1));
      return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, emissive: new THREE.Color(0xFFE6C8), emissiveIntensity: 0 });
    }
    const topMat = new THREE.MeshStandardMaterial({ color: 0xE8D6C2, roughness: 0.9 });

    const floors = []; let y = 0;
    FLOORS.forEach((f, i) => {
      const h = i === 0 ? GH : FH;
      const grp = new THREE.Group();
      const fm = frontMat(i), sm = sideMat(i);
      const box = new THREE.Mesh(new THREE.BoxGeometry(W, h, D), [sm, sm, topMat, topMat, fm, fm]);
      box.castShadow = box.receiveShadow = true; box.userData.floor = i;
      grp.add(box);
      const cornice = new THREE.Mesh(new THREE.BoxGeometry(W + 0.22, 0.08, D + 0.22), trim);
      cornice.position.y = h / 2 - 0.02; cornice.castShadow = true; grp.add(cornice);
      grp.position.y = y + h / 2;
      scene.add(grp);
      floors.push({ grp, box, mats: [fm, sm], y: y + h / 2, h, z: 0, glow: 0 });
      y += h;
    });
    const roofBase = y;
    // canopy, columns, urns, lanterns at the entrance
    const canopy = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, 0.12, 40, 1, false, -Math.PI / 2, Math.PI), new THREE.MeshStandardMaterial({ color: 0xCDBFAF, roughness: 0.6 }));
    canopy.position.set(0, GH - 0.18, D / 2); canopy.castShadow = true; floors[0].grp.add(canopy); canopy.position.y -= GH / 2;
    const canopyRim = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.03, 8, 40, Math.PI), gold);
    canopyRim.rotation.x = Math.PI / 2; canopyRim.rotation.z = Math.PI; canopyRim.position.copy(canopy.position); floors[0].grp.add(canopyRim);
    [-0.85, 0.85].forEach(x => {
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, GH - 0.25, 16), trim);
      col.position.set(x, -0.12, D / 2 + 0.75); col.castShadow = true; floors[0].grp.add(col);
      const urn = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.1, 0.22, 16), trim); urn.position.set(x * 1.45, -GH / 2 + 0.11, D / 2 + 0.55); floors[0].grp.add(urn);
      const tree = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.5, 16), new THREE.MeshStandardMaterial({ color: 0x6F8A5E, roughness: 0.9 }));
      tree.position.set(x * 1.45, -GH / 2 + 0.47, D / 2 + 0.55); tree.castShadow = true; floors[0].grp.add(tree);
    });
    [-3.6, 3.6].forEach(x => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 2.1, 10), new THREE.MeshStandardMaterial({ color: 0x2A2522, roughness: 0.5 }));
      post.position.set(x, 1.05, D / 2 + 1.4); post.castShadow = true; scene.add(post);
      const lamp = new THREE.Mesh(new THREE.OctahedronGeometry(0.14, 0), new THREE.MeshStandardMaterial({ color: 0xFFF1D6, emissive: 0xFFE2B0, emissiveIntensity: 0.4, roughness: 0.3 }));
      lamp.position.set(x, 2.2, D / 2 + 1.4); scene.add(lamp);
    });
    // mansard roof, dormers, chimneys, drum, dome, perfume-stopper finial
    const mansard = new THREE.Mesh(new THREE.CylinderGeometry(3.25, 4.45, 1.05, 4, 1), slate);
    mansard.rotation.y = Math.PI / 4; mansard.scale.set(1, 1, D / W); mansard.position.y = roofBase + 0.52; mansard.castShadow = true; scene.add(mansard);
    // the cylinder is rotated, so scale on world axes via a wrapper
    const roof = new THREE.Group(); scene.remove(mansard); mansard.scale.set(1, 1, 1); mansard.position.set(0, 0, 0); roof.add(mansard);
    roof.scale.set(1, 1, (D + 0.25) / (W + 0.25)); roof.position.y = roofBase + 0.52; scene.add(roof);
    const dormTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#F6ECDF'; g.fillRect(0, 0, w, h); const gl = g.createLinearGradient(0, 40, 0, 220); gl.addColorStop(0, '#D3DEE3'); gl.addColorStop(1, '#93A6AF'); g.fillStyle = gl; roundWin(g, 60, 40, 136, 190, true); });
    [-2.1, 2.1].forEach(x => {
      const dorm = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.62, 0.5), [trim, trim, trim, trim, new THREE.MeshStandardMaterial({ map: dormTex, roughness: 0.8 }), trim]);
      dorm.position.set(x, roofBase + 0.5, D / 2 - 0.15); dorm.castShadow = true; scene.add(dorm);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.5, 20, 1, false, 0, Math.PI), slate);
      cap.rotation.z = Math.PI / 2; cap.rotation.y = Math.PI / 2; cap.position.set(x, roofBase + 0.81, D / 2 - 0.15); scene.add(cap);
    });
    [[-2.5, -1.2], [2.5, -1.2], [-2.5, 1.0], [2.5, 1.0]].forEach(([x, z]) => {
      const ch = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.6, 0.26), new THREE.MeshStandardMaterial({ color: 0xDCC6AE, roughness: 0.9 }));
      ch.position.set(x, roofBase + 1.25, z); ch.castShadow = true; scene.add(ch);
    });
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.2, 0.45, 40), new THREE.MeshStandardMaterial({ color: 0xEEDFCC, roughness: 0.85 }));
    drum.position.y = roofBase + 1.27; drum.castShadow = true; scene.add(drum);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(1.12, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), slate);
    dome.position.y = roofBase + 1.48; dome.castShadow = true; scene.add(dome);
    const lantern = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.3, 16), trim); lantern.position.y = roofBase + 2.72; scene.add(lantern);
    const stopper = new THREE.Mesh(new THREE.OctahedronGeometry(0.2, 0), gold); stopper.scale.set(0.8, 1.4, 0.8); stopper.position.y = roofBase + 3.12; scene.add(stopper);
    const top = roofBase + 3.3;

    // neighbours: soft sandstone blocks for context
    [[-9.2, 6.2, 3.6], [-14, 5, 3], [9.2, 7, 3.6], [14, 5.6, 3]].forEach(([x, h, w], k) => {
      const t = canvasTex(512, 512, (g, ww, hh) => windowRow(g, ww, hh, 4, k % 2 === 0, k), 0); t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, Math.round(h / 1.1));
      const m = new THREE.MeshStandardMaterial({ map: t, color: 0xF2E4D6, roughness: 0.95, transparent: true, opacity: 0.72 });
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 3.4), m); b.position.set(x, h / 2, -1.2); b.receiveShadow = true; scene.add(b);
    });

    // labels
    const labelBox = $('#labels');
    floors.forEach((f, i) => {
      const el = document.createElement('div'); el.className = 'flabel'; el.innerHTML = `<i>${FLOORS[i].n}</i>${FLOORS[i].name}`;
      el.addEventListener('click', () => show(4 + i)); labelBox.appendChild(el); f.label = el;
    });

    // camera rig
    const camPos = new THREE.Vector3(14, 7, 18), camLook = new THREE.Vector3(0, 4, 0);
    const wantPos = camPos.clone(), wantLook = camLook.clone();
    let view = 'cover', active = -1, theta = 0, userTheta = 0, autoSpin = 0;
    const midY = top / 2;
    function setView(slide) {
      view = slide.view; active = slide.view === 'floor' ? slide.floor : -1; userTheta *= 0.3;
      floors.forEach((f, i) => { f.zT = i === active ? 1.25 : 0; f.glowT = i === active ? 0.22 : 0; });
      if (reduce) snap = true;
    }
    let snap = true;
    function target() {
      const mobile = innerWidth <= 820;
      let r, h, look;
      if (view === 'floor') { const fy = floors[active].y; r = 13.5; h = fy + 2.4; look = new THREE.Vector3(0, fy + 0.2, 0.8); theta = 0.55; }
      else if (view === 'overview') { r = 17; h = midY + 2.2; look = new THREE.Vector3(0, midY, 0); theta = 0.5; }
      else if (view === 'universe') { r = 25; h = 5.5; look = new THREE.Vector3(0, midY - 0.6, 0); theta = 0.02; }
      else { r = 24; h = midY + 3; look = new THREE.Vector3(0, midY - 0.3, 0); }
      r *= Math.min(2.3, Math.max(1, 0.95 / camera.aspect)); if (mobile) h += 1.2;
      const ang = (view === 'cover' || view === 'wide' ? autoSpin : theta) + userTheta;
      wantPos.set(Math.sin(ang) * r, h, Math.cos(ang) * r);
      wantLook.copy(look);
    }

    // interaction: drag to orbit, click a floor
    const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
    let down = null;
    canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: userTheta, moved: false }; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); });
    canvas.addEventListener('pointermove', e => {
      if (!down) return; const dx = e.clientX - down.x;
      if (Math.abs(dx) > 4) down.moved = true;
      userTheta = down.t - dx * 0.008; snap = false;
    });
    canvas.addEventListener('pointerup', e => {
      canvas.classList.remove('dragging');
      if (down && !down.moved) {
        const r = canvas.getBoundingClientRect();
        ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
        ray.setFromCamera(ptr, camera);
        const hit = ray.intersectObjects(floors.map(f => f.box))[0];
        if (hit) show(4 + hit.object.userData.floor);
      }
      down = null;
    });

    function resize() {
      const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
      const mobile = w <= 820, cardEl = $('#card');
      if (!mobile) { const cw = cardEl.offsetWidth + 48; camera.setViewOffset(w, h, cw / 2, 0, w, h); }
      else { const ch = Math.min(cardEl.offsetHeight + 74, h * 0.6); camera.setViewOffset(w, h, 0, ch / 2 - 30, w, h); }
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    new ResizeObserver(resize).observe($('#card'));

    const v = new THREE.Vector3(); let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!reduce && (view === 'cover' || view === 'wide') && !down) autoSpin += dt * 0.12;
      target();
      const k = snap ? 1 : 1 - Math.exp(-dt * 3.2); snap = false;
      camPos.lerp(wantPos, k); camLook.lerp(wantLook, k);
      camera.position.copy(camPos); camera.lookAt(camLook);
      floors.forEach((f, i) => {
        f.z += ((f.zT || 0) - f.z) * (reduce ? 1 : 1 - Math.exp(-dt * 5));
        f.glow += ((f.glowT || 0) - f.glow) * (1 - Math.exp(-dt * 5));
        f.grp.position.z = f.z; f.mats.forEach(m => { m.emissiveIntensity = f.glow; });
        // label at the right-front corner of the floor
        v.set(W / 2 + 0.15, f.y, D / 2 + f.z); v.project(camera);
        const sx = (v.x * 0.5 + 0.5) * innerWidth, sy = (-v.y * 0.5 + 0.5) * innerHeight;
        const visible = (view === 'overview' || i === active) && v.z < 1;
        f.label.style.left = Math.max(8, Math.min(sx + 10, innerWidth - f.label.offsetWidth - 8)) + 'px'; f.label.style.top = sy + 'px';
        f.label.classList.toggle('dim', !visible); f.label.classList.toggle('on', i === active);
      });
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    resize(); requestAnimationFrame(frame);
    return { setView };
  }
})();
</script>
